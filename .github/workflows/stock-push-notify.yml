name: 📈 Stock 选股推送

# 定时推送已停用：由本机 crontab 负责（08:50 跑 stock.py → 09:05 PushPlus）
# 保留 workflow_dispatch 供手动补发
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install akshare pandas requests baostock flask

      - name: 发送 Stock 推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: |
          cd "01_量化模型/首板战法/每日交易记录"
          python3 send_push_notify.py --program stock
