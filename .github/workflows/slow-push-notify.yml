name: 🐢 Slow 低价一进二推送

# 定时推送已停用：由本机 crontab 负责（08:50 跑 slow.py → 09:10 PushPlus）
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install akshare pandas requests baostock flask

      - name: 发送 Slow 推送（2026-10-29 起暂停 PushPlus，见 通知规范）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: |
          echo "slow PushPlus 已暂停（01_量化模型/通知规范/PushPlus通知规范.md §3）"
          cd "01_量化模型/首板战法/每日交易记录/jobs"
          python3 send_push_notify.py --program slow --sync-only || true
          # 通知入口会按 PAUSED_NOTIFY_PROGRAMS 直接 exit 0
          python3 send_push_notify.py --program slow
