<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交易数据记录 · 首板战法</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M12 42 L22 34 L30 38 L42 22 L52 28' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='19' y='30' width='6' height='12' rx='1.2' fill='%23bfdbfe'/%3E%3Crect x='27' y='34' width='6' height='10' rx='1.2' fill='%23eff6ff'/%3E%3Crect x='39' y='18' width='6' height='16' rx='1.2' fill='%23fecaca'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M12 42 L22 34 L30 38 L42 22 L52 28' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='19' y='30' width='6' height='12' rx='1.2' fill='%23bfdbfe'/%3E%3Crect x='27' y='34' width='6' height='10' rx='1.2' fill='%23eff6ff'/%3E%3Crect x='39' y='18' width='6' height='16' rx='1.2' fill='%23fecaca'/%3E%3C/svg%3E" />
  <style>
    :root {
      --sky: #3b82f6;
      --sky-soft: #dbeafe;
      --sky-bar: #60a5fa;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --head: #e5e7eb;
      --profit: #dc2626;
      --loss: #16a34a;
      --red-deep: #b91c1c;
      --red-light: #fecaca;
      --yellow-light: #fef08a;
      --yellow-deep: #eab308;
      --shadow: 0 8px 24px rgba(59, 130, 246, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      background: linear-gradient(120deg, #93c5fd 0%, #60a5fa 45%, #3b82f6 100%);
      color: #fff;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(59,130,246,.28);
    }
    .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.08); }
    .topbar .hint { font-size: 12px; opacity: .92; margin-top: 4px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .top-actions select, .top-actions a, .top-actions button {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.2);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform .15s, background .15s;
    }
    .top-actions select option { color: #111; }
    .top-actions a { text-decoration: none; }

    /* ── 12 宫格月份选择器 ─────────────────────────────────
       顶部年份（默认今年）→ 点开后下方年份也是 12 宫格（左上角第一个 = 今年）
       → 选中年份 → 跳到该年 12 宫格月份。 */
    .mpicker { position: relative; display: inline-block; }
    .mpicker-trigger {
      display: inline-flex !important; align-items: center; gap: 6px;
      min-width: 116px; justify-content: space-between !important;
    }
    .mpicker-caret { font-size: 10px; opacity: .85; }
    .mpicker-panel {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      width: 300px; padding: 12px; z-index: 60;
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }
    .mpicker-panel.show { display: block; }
    /* 顶部年份行 */
    .mpicker-years {
      display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .top-actions .mpicker-year {
      border: 1px solid var(--line); background: #fff; color: var(--muted);
      border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 12px;
      cursor: pointer; transition: .15s; white-space: nowrap;
    }
    .top-actions .mpicker-year:hover { border-color: #93c5fd; color: #1d4ed8; }
    .top-actions .mpicker-year.active {
      background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600;
    }
    /* 年份行右侧：回到当前月 */
    .mpicker-years-right { margin-left: auto; display: flex; align-items: center; }
    .top-actions .mpicker-now {
      border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8;
      border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px;
      cursor: pointer; white-space: nowrap; transition: .15s;
    }
    .top-actions .mpicker-now:hover { background: #dbeafe; border-color: #60a5fa; }
    /* 12 宫格：3 列 × 4 行 */
    .mpicker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .top-actions .mpicker-cell {
      border: 1px solid var(--line); background: #fff; color: #111;
      border-radius: 9px; padding: 10px 4px; font: inherit; font-size: 13px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      transition: transform .12s, border-color .15s, background .15s;
    }
    .top-actions .mpicker-cell:hover:not(:disabled) {
      border-color: #60a5fa; background: #eff6ff; transform: translateY(-1px);
    }
    .mpicker-cell .m-mm { font-size: 15px; font-weight: 600; line-height: 1.2; color: #111; }
    .mpicker-cell .m-cn { font-size: 11px; color: var(--muted); line-height: 1.2; }
    .mpicker-cell.active {
      background: #2563eb; border-color: #2563eb; color: #fff;
      box-shadow: 0 4px 10px rgba(37,99,235,.28);
    }
    .mpicker-cell.active .m-cn { color: rgba(255,255,255,.85); }
    .mpicker-cell:disabled {
      background: #f8fafc; color: #cbd5e1; cursor: not-allowed;
      border-style: dashed; opacity: .75;
    }
    .mpicker-cell:disabled .m-cn { color: #cbd5e1; }
    .mpicker-cell.empty .m-mm { color: #94a3b8; font-weight: 500; }
    .mpicker-cell.empty:hover { background: #f8fafc; border-color: var(--line); }
    .mpicker-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    }
    .top-actions .mpicker-nav {
      border: 1px solid var(--line); background: #fff; color: var(--muted);
      border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    .top-actions .mpicker-nav:hover:not(:disabled) { border-color: #93c5fd; color: #1d4ed8; }
    .top-actions .mpicker-nav:disabled { opacity: .4; cursor: not-allowed; }
    .mpicker-pageinfo { font-size: 11px; color: var(--muted); }
    .top-actions .view-toggle.active {
      background: rgba(255,255,255,.95);
      color: #1d4ed8;
      font-weight: 700;
      border-color: #fff;
    }
    .board-hint {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      padding: 10px 14px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #eff6ff;
      box-shadow: var(--shadow);
    }
    .board-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    .board-panel {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid #eff6ff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .board-panel-title {
      padding: 14px 16px;
      font-weight: 800;
      font-size: 17px;
      text-align: center;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-bottom: 1px solid #dbeafe;
      color: #1e40af;
      letter-spacing: .04em;
    }
    .board-panel .table-wrap { border-radius: 0; box-shadow: none; }
    @media (max-width: 960px) {
      .board-split { grid-template-columns: 1fr; }
    }

    .wrap { padding: 16px 20px 40px; }
    .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .tab {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      padding: 9px 22px;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15,23,42,.04);
      transition: .18s transform, .18s box-shadow, .18s background, .18s color;
    }
    .tab:hover { transform: translateY(-1px); border-color: #bfdbfe; color: #1d4ed8; }
    .tab.active {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 16px rgba(59,130,246,.28);
    }
    @media (max-width: 860px) {
      .nav-row { padding: 26px 8px 8px; }
      .nav-row-label {
        left: 50%; top: 6px; transform: translateX(-50%);
        font-size: 10px;
      }
      .prog-tab { padding: 8px 12px; font-size: 12px; }
      .nav-stack { padding: 10px; gap: 8px; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 12px;
      box-shadow: var(--shadow);
      border: 1px solid #eff6ff;
      text-align: center;
      transition: transform .18s, box-shadow .18s;
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: var(--accent, var(--sky));
    }
    .stat:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 14px 28px rgba(59,130,246,.18);
    }
    .stat .icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; margin: 0 auto 8px;
      background: var(--icon-bg, var(--sky-soft));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .stat .value { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .stat .value.pos { color: var(--profit); }
    .stat .value.neg { color: var(--loss); }
    .stat .label { margin-top: 6px; font-size: 12px; color: var(--muted); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px; background: #fff; border-radius: 16px;
      padding: 12px 14px; box-shadow: var(--shadow); border: 1px solid #eff6ff;
    }
    .search-box { flex: 1; min-width: 200px; position: relative; }
    .search-box input {
      width: 100%; padding: 9px 12px 9px 34px;
      border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #f9fafb;
    }
    .search-box::before {
      content: "⌕"; position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%); color: var(--muted);
    }
    select, .toolbar button {
      font: inherit; border-radius: 10px; border: 1px solid var(--line);
      padding: 8px 12px; background: #fff; color: var(--text); cursor: pointer;
    }
    .toolbar button.primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
      border: 1px solid #1d4ed8 !important;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }
    .toolbar button.primary:hover {
      filter: brightness(1.06);
      color: #ffffff !important;
    }

    .table-card {
      background: #fff; border-radius: 16px; box-shadow: var(--shadow);
      border: 1px solid #eff6ff; overflow: hidden;
    }
    .table-wrap { overflow: auto; max-height: calc(100vh - 360px); }
    table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12.5px; }
    th, td {
      padding: 9px 10px; white-space: nowrap; text-align: center;
      border-bottom: 1px solid var(--line);
    }
    th {
      position: sticky; top: 0; z-index: 3;
      background: var(--head); color: #374151;
      font-weight: 700; font-size: 12px;
      user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { background: #dbeafe; }
    th .sort-ind { font-size: 10px; margin-left: 2px; color: #9ca3af; }
    th.sorted .sort-ind { color: var(--sky); }
    tbody tr:nth-child(even) td { background: #f9fafb; }
    tbody tr:hover td { background: #eff6ff !important; }
    tr.sum-row td {
      background: #f0f9ff !important;
      font-weight: 700;
      border-top: 2px solid #93c5fd;
      position: sticky; top: 36px; z-index: 2;
    }
    td.left { text-align: left; font-weight: 650; }
    .code { color: var(--muted); font-variant-numeric: tabular-nums; }
    .weekday { color: #475569; font-weight: 650; }

    .pnl-red-deep { background: #fca5a5 !important; color: #7f1d1d; font-weight: 700; }
    .pnl-red-light { background: #fecaca !important; color: #991b1b; font-weight: 700; }
    .pnl-yellow-light { background: #fef08a !important; color: #854d0e; font-weight: 700; }
    .pnl-yellow-deep { background: #facc15 !important; color: #713f12; font-weight: 800; }

    /* 历史看板盈亏背景色阶（数据行） */
    .bp-deep-green { background: #4ade80 !important; color: #111 !important; }
    .bp-light-green { background: #86efac !important; color: #111 !important; }
    .bp-pale-green { background: #dcfce7 !important; color: #111 !important; }
    .bp-pale-red { background: #fee2e2 !important; color: #111 !important; }
    .bp-light-red { background: #fca5a5 !important; color: #111 !important; }
    .bp-deep-red { background: #ef4444 !important; color: #111 !important; font-weight: 700; }
    /* 本页合计字体色阶 */
    .bs-t-g0 { color: #15803d !important; font-weight: 700; background: #f0f9ff !important; }
    .bs-t-g1 { color: #16a34a !important; font-weight: 700; background: #f0f9ff !important; }
    .bs-t-g2 { color: #22c55e !important; background: #f0f9ff !important; }
    .bs-t-g3 { color: #4ade80 !important; background: #f0f9ff !important; }
    .bs-t-r0 { color: #fca5a5 !important; background: #f0f9ff !important; }
    .bs-t-r1 { color: #f87171 !important; background: #f0f9ff !important; }
    .bs-t-r2 { color: #ef4444 !important; background: #f0f9ff !important; }
    .bs-t-r3 { color: #dc2626 !important; font-weight: 700; background: #f0f9ff !important; }
    .month-profit { color: #dc2626; font-weight: 700; }
    .month-loss { color: #16a34a; font-weight: 600; }
    .month-link { cursor: pointer; color: #1d4ed8; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
    .month-link:hover { color: #1e40af; }
    .rank-tag {
      display: inline-block; text-align: center; font-weight: 800;
      font-size: 15px; letter-spacing: .02em;
    }
    .rank-tag.rank-1 { color: #c2410c; }
    .rank-tag.rank-2 { color: #475569; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .badge-yes { background: #dcfce7; color: #15803d; }
    .badge-no { background: #f3f4f6; color: #6b7280; }
    .badge-hold { background: #fef3c7; color: #b45309; }
    .badge-no-buy { background: #6b7280; color: #f9fafb; font-weight: 700; }
    .board-tag {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
      white-space: nowrap;
    }
    .board-cyb { background: #ede9fe; color: #6d28d9; }
    .board-zb { background: #dbeafe; color: #1d4ed8; }
    .board-other { background: #f3f4f6; color: #4b5563; }
    /* ── 四层导航：每层底色 / 形状 / 选中色分开 ── */
    .nav-stack {
      display: flex; flex-direction: column; gap: 8px;
      margin: 0 0 14px; padding: 12px;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 18px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
    }
    .nav-row {
      position: relative;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center;
      padding: 10px 72px; border-radius: 14px; min-height: 54px;
    }
    .nav-row-label {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 11px; font-weight: 800; letter-spacing: .12em;
      pointer-events: none;
    }
    .nav-l1 { background: #eef2ff; border: 1px solid #c7d2fe; }
    .nav-l1 .nav-row-label { color: #3730a3; }
    .nav-l2 { background: #f5f3ff; border: 1px solid #ddd6fe; }
    .nav-l2 .nav-row-label { color: #6d28d9; }
    .nav-l3 { background: #fff7ed; border: 1px solid #fed7aa; }
    .nav-l3 .nav-row-label { color: #c2410c; }
    .nav-l4 { background: #fffbeb; border: 1px solid #fde68a; }
    .nav-l4 .nav-row-label { color: #a16207; }
    .prog-tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .prog-tab {
      border: 1.5px solid transparent;
      padding: 10px 18px;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: .16s transform, .16s box-shadow, .16s background, .16s color;
      letter-spacing: .02em;
    }
    .prog-tab:hover { transform: translateY(-1px); filter: brightness(.97); }
    .prog-tab.prog-stock { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .prog-tab.prog-stock_v2 { background: #ffe4e6; color: #be123c; border-color: #fda4af; }
    .prog-tab.prog-stock_updata { background: #ccfbf1; color: #0f766e; border-color: #5eead4; }
    .prog-tab.prog-slow { background: #ffedd5; color: #c2410c; border-color: #fdba74; }
    .prog-tab.prog-up { background: #d1fae5; color: #047857; border-color: #6ee7b7; }
    .prog-tab.active { color: #fff; border-color: transparent; }
    .prog-tab.prog-stock.active {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 8px 16px rgba(37, 99, 235, .32);
    }
    .prog-tab.prog-slow.active {
      background: linear-gradient(135deg, #fb923c, #ea580c);
      box-shadow: 0 8px 16px rgba(234, 88, 12, .32);
    }
    .prog-tab.prog-up.active {
      background: linear-gradient(135deg, #34d399, #059669);
      box-shadow: 0 8px 16px rgba(5, 150, 105, .32);
    }
    .prog-tab.prog-stock_updata.active {
      background: linear-gradient(135deg, #2dd4bf, #0f766e);
      box-shadow: 0 8px 16px rgba(15, 118, 110, .32);
    }
    .prog-tab.prog-stock_v2.active {
      background: linear-gradient(135deg, #fb7185, #be123c);
      box-shadow: 0 8px 16px rgba(190, 18, 60, .32);
    }
    .sub-tabs {
      display: none; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .sub-tabs.show { display: flex; }
    .sub-tab {
      border: 1px dashed #c4b5fd; background: #fff; color: #6d28d9;
      padding: 8px 16px; border-radius: 8px; font: inherit; font-size: 13px;
      font-weight: 700; cursor: pointer;
      transition: .15s background, .15s color, .15s border-color, .15s box-shadow;
    }
    .sub-tab:hover { transform: translateY(-1px); }
    .sub-tab.sub-all { border-style: solid; border-color: #a5b4fc; color: #4338ca; background: #eef2ff; }
    .sub-tab.sub-main { border-style: solid; border-color: #93c5fd; color: #1d4ed8; background: #eff6ff; }
    .sub-tab.sub-cyb { border-style: solid; border-color: #d8b4fe; color: #7e22ce; background: #faf5ff; }
    .sub-tab.sub-v2a { border-style: solid; border-color: #fda4af; color: #be123c; background: #fff1f2; }
    .sub-tab.sub-v2b { border-style: solid; border-color: #6ee7b7; color: #047857; background: #ecfdf5; }
    .sub-tab.sub-all.active { background: #4f46e5; color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(79,70,229,.28); }

  <script>
    // GitHub Pages：静态脱敏 + 登录解密；本机 Flask（localhost）不走此模式
    window.__PAGES_MODE__ = /github\.io$/i.test(location.hostname)
      || /(?:\?|&)pages=1(?:&|$)/.test(location.search)
      || /\/stock-quant-select\/trade-ui\/?/.test(location.pathname);
    if (window.__PAGES_MODE__) document.documentElement.classList.add("pages-mode");
    window.__PAGES_FULL__ = null;
    window.__PAGES_SNAPSHOT__ = null;
    window.__PAGES_MASKED__ = null;

    function pagesEffPath(t) {
      const p = String(t.path || "").trim().toUpperCase();
      if (p === "A" || p === "B") return p;
      const slot = String(t.slot || "").trim().toUpperCase();
      if (slot.slice(0, 1) === "A" || slot.slice(0, 1) === "B") return slot.slice(0, 1);
      const notes = String(t.notes || "");
      let m = notes.match(/path\s*=\s*([AB])/i);
      if (m) return m[1].toUpperCase();
      m = notes.match(/V2\s*([AB])\b/i);
      return m ? m[1].toUpperCase() : "";
    }

    function pagesFilterTrades(list, params) {
      let trades = list.slice();
      const month = params.get("month") || "";
      const date = params.get("date") || "";
      const rank = params.get("rank") || "";
      const keyword = (params.get("keyword") || "").toLowerCase();
      const board = params.get("board") || "";
      const boardRank = params.get("board_rank") || "";
      const path = (params.get("path") || "").toUpperCase();
      const pathRank = params.get("path_rank") || "";
      if (month) trades = trades.filter(t => String(t.date || "").startsWith(month));
      if (date) trades = trades.filter(t => String(t.date || "") === date);
      if (rank) {
        const r = Number(rank);
        trades = trades.filter(t => Number(t.rank || 0) === r);
      } else {
        const ranks = params.get("ranks") || "";
        if (ranks) {
          const allow = new Set(ranks.split(",").map(s => Number(s.trim())).filter(n => !Number.isNaN(n)));
          trades = trades.filter(t => allow.has(Number(t.rank || 0)));
        }
      }
      if (path === "A" || path === "B") {
        trades = trades.filter(t => pagesEffPath(t) === path);
        if (pathRank) {
          const pr = Number(pathRank);
          trades = trades.filter(t => Number(t.path_rank || 0) === pr);
        }
      }
      if (keyword) {
        trades = trades.filter(t =>
          String(t.stock_code || "").toLowerCase().includes(keyword)
          || String(t.stock_name || "").toLowerCase().includes(keyword)
        );
      }
      if (board) {
        trades = trades.filter(t => (t.board || "") === board && t.board_rank != null);
        if (boardRank) {
          const br = Number(boardRank);
          trades = trades.filter(t => Number(t.board_rank || 0) === br);
        }
      }
      trades.sort((a, b) => {
        const da = String(a.date || "");
        const db = String(b.date || "");
        if (da !== db) return db.localeCompare(da);
        return Number(b.id || 0) - Number(a.id || 0);
      });
      return trades;
    }

    function pagesComputeStats(list, month) {
      const total = list.length;
      const empty = {
        total: 0, completed: 0, holding: 0,
        win_rate_morning: 0, win_rate_afternoon: 0, win_rate_batch: 0,
        sum_pnl_morning: 0, sum_pnl_afternoon: 0, sum_pnl_batch: 0,
        sum_pnl_batch_half: 0, avg_pnl_morning: 0, avg_pnl_afternoon: 0,
        avg_pnl_batch: 0, second_board_count: 0, second_board_rate: 0,
        board_cyb_count: 0, board_zb_count: 0,
        month_pnl_morning_half: 0, month_pnl_afternoon_half: 0, month_pnl_batch_half: 0,
        max_win_streak: 0, max_loss_streak: 0, month: month || null,
      };
      if (!total) return empty;
      const completed = list.filter(t => t.sell_price_935 != null || t.sell_price_1315 != null).length;
      const sum = (key) => list.reduce((a, t) => a + (t[key] != null ? Number(t[key]) : 0), 0);
      const round2 = (n) => Math.round(n * 100) / 100;
      let maxWin = 0, maxLoss = 0, curW = 0, curL = 0;
      const ordered = list.slice().sort((a, b) => String(a.date||"").localeCompare(String(b.date||"")) || Number(a.id||0)-Number(b.id||0));
      ordered.forEach(t => {
        const pnl = t.pnl_batch_total;
        if (pnl == null) { curW = curL = 0; return; }
        if (Number(pnl) > 0) { curW += 1; curL = 0; maxWin = Math.max(maxWin, curW); }
        else if (Number(pnl) < 0) { curL += 1; curW = 0; maxLoss = Math.max(maxLoss, curL); }
        else { curW = curL = 0; }
      });
      let cyb = 0, zb = 0;
      list.forEach(t => {
        if (t.board === "创业板") cyb += 1;
        else if (t.board === "主板") zb += 1;
      });
      return {
        ...empty,
        total,
        completed,
        holding: total - completed,
        board_cyb_count: cyb,
        board_zb_count: zb,
        month_pnl_morning_half: round2(sum("pnl_morning_half")),
        month_pnl_afternoon_half: round2(sum("pnl_afternoon_half")),
        month_pnl_batch_half: round2(sum("pnl_batch_total_half")),
        max_win_streak: maxWin,
        max_loss_streak: maxLoss,
        month: month || null,
      };
    }

    function pagesEmptyBucket() {
      return { morning: 0, morning_half: 0, afternoon: 0, afternoon_half: 0, batch: 0, batch_half: 0, count: 0 };
    }

    function pagesAccumulateMonths(list) {
      const by = {};
      list.forEach(t => {
        const d = String(t.date || "");
        if (d.length < 7) return;
        const m = d.slice(0, 7);
        const b = by[m] || (by[m] = pagesEmptyBucket());
        b.count += 1;
        const map = [
          ["pnl_morning", "morning"], ["pnl_morning_half", "morning_half"],
          ["pnl_afternoon", "afternoon"], ["pnl_afternoon_half", "afternoon_half"],
          ["pnl_batch_total", "batch"], ["pnl_batch_total_half", "batch_half"],
        ];
        map.forEach(([src, dst]) => {
          if (t[src] != null) b[dst] += Number(t[src]);
        });
      });
      Object.values(by).forEach(b => {
        ["morning","morning_half","afternoon","afternoon_half","batch","batch_half"].forEach(k => {
          b[k] = Math.round(b[k] * 100) / 100;
        });
      });
      return by;
    }

    function pagesHistoryBoard(program, board, page, pageSize, year, monthFrom, monthTo, path) {
      let list = pagesProgramTrades(program);
      const pathKey = (path || "").toUpperCase();
      if (pathKey === "A" || pathKey === "B") {
        list = list.filter(t => pagesEffPath(t) === pathKey);
      }
      if (board) list = list.filter(t => (t.board || "") === board && t.board_rank != null);
      let r1src, r2src;
      if (board) {
        r1src = list.filter(t => Number(t.board_rank || 0) === 1);
        r2src = list.filter(t => Number(t.board_rank || 0) === 2);
      } else if (pathKey === "A" || pathKey === "B") {
        r1src = list.filter(t => Number(t.path_rank || 0) === 1);
        r2src = list.filter(t => Number(t.path_rank || 0) === 2);
      } else {
        r1src = list.filter(t => Number(t.rank || 0) === 1);
        r2src = list.filter(t => Number(t.rank || 0) === 2);
      }
      const r1 = pagesAccumulateMonths(r1src);
      const r2 = pagesAccumulateMonths(r2src);
      let months = Array.from(new Set([...Object.keys(r1), ...Object.keys(r2)])).sort().reverse();
      const years = Array.from(new Set(months.map(m => m.slice(0, 4)))).sort().reverse();
      if (year) months = months.filter(m => m.startsWith(year + "-"));
      if (monthFrom) months = months.filter(m => m >= monthFrom);
      if (monthTo) months = months.filter(m => m <= monthTo);
      const indexMap = (pagesActiveSnapshot().index_months) || {};
      const rowsAll = months.map(month => {
        const ix = indexMap[month];
        const pct = (ix && typeof ix === "object") ? ix.pct : ix;
        return {
          month,
          rank1: r1[month] || pagesEmptyBucket(),
          rank2: r2[month] || pagesEmptyBucket(),
          index_pct: (pct == null || pct === "") ? null : Number(pct),
        };
      });
      const total = rowsAll.length;
      const totalPages = Math.max(1, Math.ceil((total || 1) / pageSize));
      const p = Math.min(Math.max(1, page), totalPages);
      const start = (p - 1) * pageSize;
      return {
        program, board: board || null, path: pathKey || null,
        rows: rowsAll.slice(start, start + pageSize),
        total, page: p, page_size: pageSize, total_pages: totalPages, years,
      };
    }

    async function pagesApi(url, opts) {
      const method = ((opts && opts.method) || "GET").toUpperCase();
      if (method !== "GET") throw new Error("Pages 只读：请在本机 UI 操作写接口");
      const u = new URL(url, location.origin);
      const path = u.pathname.replace(/^\/+/, "/");
      const params = u.searchParams;
      const program = params.get("program") || "stock";
      if (path === "/api/trades" || path.endsWith("/api/trades")) {
        return pagesFilterTrades(pagesProgramTrades(program), params);
      }
      if (path === "/api/stats" || path.endsWith("/api/stats")) {
        const filtered = pagesFilterTrades(pagesProgramTrades(program), params);
        return pagesComputeStats(filtered, params.get("month") || "");
      }
      if (path === "/api/months" || path.endsWith("/api/months")) {
        const list = pagesProgramTrades(program);
        const months = Array.from(new Set(list.map(t => String(t.date || "").slice(0, 7)).filter(Boolean))).sort().reverse();
        const cur = new Date().toISOString().slice(0, 7);
        return [cur, ...months.filter(m => m !== cur)];
      }
      if (path === "/api/dates" || path.endsWith("/api/dates")) {
        const list = pagesProgramTrades(program);
        return Array.from(new Set(list.map(t => String(t.date || "")).filter(Boolean))).sort().reverse();
      }
      if (path === "/api/history-board" || path.endsWith("/api/history-board")) {
        return pagesHistoryBoard(
          program,
          params.get("board") || "",
          Number(params.get("page") || 1),
          Math.max(1, Math.min(200, Number(params.get("page_size") || 40))),
          params.get("year") || "",
          params.get("month_from") || "",
          params.get("month_to") || "",
          params.get("path") || ""
        );
      }
      if (path.indexOf("/api/jobs/after-close/status") >= 0) {
        return { pages: true, note: "Pages 只读镜像" };
      }
      throw new Error("Pages 不支持接口 " + path);
    }

    async function api(url, opts) {
      if (window.__PAGES_MODE__) return pagesApi(url, opts);
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "请求失败");
      return json.data;
    }

    /* ── 12 宫格月份选择器 ─────────────────────────────────
       两级结构（2026-10-26 用户要求）：
         ① 顶部年份按钮，默认显示今年；点开 → 下方展开「年份 12 宫格」
            （左上角第一个 = 今年；到 2027 年时左上角自动变成 2027 年）
         ② 年份宫格点某年 → 跳到该年的「月份 12 宫格」（全年 12 个月都列出，
            11/12 月无数据也照常显示可点，点了就是空表）
       月份顺序：1→12 正序（比倒序更符合"全年"直觉）。
       原生 <select id="monthFilter"> 保留但隐藏，仍是月份状态真值载体。 */
    const MPICKER_PAGE = 12;
    let mpickerYear = "";        // 当前展开的年份
    let mpickerYearGridOpen = false;  // 年份宫格是否展开

    /** 当前自然年（用于「左上角第一个 = 今年」规则） */
    function mpickerCurrentYear() {
      return beijingToday().slice(0, 4);
    }

    /**
     * 年份 12 宫格的数据源：
     *   左上角第一个 = 当前自然年；其后是「有数据的年份」按倒序；
     *   若仍不足 12 格，用未来年份补齐（到明年 2027 年时第一个自然变成 2027）。
     */
    function monthPickerYearList() {
      const cur = mpickerCurrentYear();
      const withData = [...new Set(
        availableMonths.filter(m => m && m.length >= 4).map(m => m.slice(0, 4))
      )].sort((a, b) => b.localeCompare(a));

      const list = [cur];
      // 有数据的年份（倒序），跳过当前年（已在首位）
      for (const y of withData) {
        if (list.length >= MPICKER_PAGE) break;
        if (!list.includes(y)) list.push(y);
      }
      // 仍不足 → 补未来年份
      let future = Number(cur);
      while (list.length < MPICKER_PAGE) {
        future += 1;
        const ys = String(future);
        if (!list.includes(ys)) list.push(ys);
      }
      return list.slice(0, MPICKER_PAGE);
    }

    /** 该年 12 个月全部列出（无数据也列） */
    function monthPickerMonthsOfYear(year) {
      const out = [];
      for (let i = 1; i <= 12; i++) {
        out.push(`${year}-${String(i).padStart(2, "0")}`);
      }
      return out;
    }

    function monthPickerHasData(m) {
      return availableMonths.includes(m);

    function renderMonthPicker() {
      if (!mpickerYear) {
        mpickerYear = currentMonth
          ? currentMonth.slice(0, 4)

      const label = document.getElementById("monthPickerLabel");
      if (label) label.textContent = currentMonth ? currentMonth.replace("-", "年") + "月" : "月份";

      // 顶部年份按钮（默认显示今年）
      const yLabel = document.getElementById("monthPickerYearLabel");
      if (yLabel) yLabel.textContent = mpickerYear + "年";
      const yBtn = document.getElementById("monthPickerYearBtn");
      if (yBtn) yBtn.classList.toggle("active", mpickerYearGridOpen);

      // 年份 12 宫格（展开时才渲染）
      const yGrid = document.getElementById("monthPickerYearGrid");
      if (yGrid) {
        if (mpickerYearGridOpen) {
          const cur = mpickerCurrentYear();
          yGrid.innerHTML = monthPickerYearList().map(y => {
            const active = y === mpickerYear ? " active" : "";
            const isCur = y === cur ? " 今年" : "";
            const hasData = availableMonths.some(m => m && m.slice(0, 4) === y);
            return `<button type="button" class="mpicker-cell${active}" onclick="monthPickerPickYear('${y}')"
                      title="${y}年${hasData ? "" : "（暂无数据）"}">
                      <span class="m-mm">${y}</span><span class="m-cn">${isCur || (hasData ? "" : "无数据")}</span>
                    </button>`;
          }).join("");
          yGrid.style.display = "";
        } else {
          yGrid.style.display = "none";
        }
      }

      // 月份 12 宫格：全年 12 个月都列出
      const list = monthPickerMonthsOfYear(mpickerYear);
      const gridEl = document.getElementById("monthPickerGrid");
      if (gridEl) {
        gridEl.innerHTML = list.map(m => {
          const mm = m.slice(5, 7);
          const active = m === currentMonth ? " active" : "";
          const empty = monthPickerHasData(m) ? "" : " empty";
          return `<button type="button" class="mpicker-cell${active}${empty}"
                    onclick="monthPickerPick('${m}')"
                    title="${m.replace("-", "年")}月${monthPickerHasData(m) ? "" : "（暂无数据）"}">
                    <span class="m-mm">${parseInt(mm, 10)}月</span>
                    <span class="m-cn">${monthPickerHasData(m) ? "" : "无"}</span>
                  </button>`;
        }).join("");
        // 年份宫格展开时隐藏月份宫格，避免两屏挤在一起
        gridEl.style.display = mpickerYearGridOpen ? "none" : "";
      }

      const info = document.getElementById("monthPickerPageInfo");
      if (info) {
        const n = list.filter(monthPickerHasData).length;
        info.textContent = mpickerYearGridOpen
          ? `${monthPickerYearList().length} 个年份`
          : `${mpickerYear}年 · ${n} 个月有数据`;
      }
      const prev = document.getElementById("monthPickerPrev");
      const next = document.getElementById("monthPickerNext");
      if (prev) prev.disabled = mpickerYearGridOpen;
      if (next) next.disabled = mpickerYearGridOpen;
    }

    function toggleSort(key) {

    function sortedTrades() {
      const arr = [...trades];
      arr.sort((a, b) => {
        let va = a[sortKey], vb = b[sortKey];
        if (sortKey === "rank" || sortKey === "board_rank" || sortKey === "path_rank") {
          va = int(a[sortKey], 99); vb = int(b[sortKey], 99);
        }
        if (va == null) va = sortDir === "asc" ? Infinity : -Infinity;
        if (vb == null) vb = sortDir === "asc" ? Infinity : -Infinity;
        if (typeof va === "string") {
          const cmp = String(va).localeCompare(String(vb), "zh");
          if (cmp !== 0) return sortDir === "asc" ? cmp : -cmp;
        } else {
          const diff = sortDir === "asc" ? (va - vb) : (vb - va);
          if (diff !== 0) return diff;
        }
        const dr = String(b.date || "").localeCompare(String(a.date || ""));
        if (dr !== 0) return dr;
        return int(a.rank, 99) - int(b.rank, 99);
      });
      return arr;
    }

    function int(v, d) {
      const n = parseInt(v, 10);
      return Number.isNaN(n) ? d : n;
    }

    async function loadMonths(force) {
      syncMonthFromDom();
      // 月份列表缓存：同程序不重复请求（程序切换时才需重拉）
      if (!force && monthsCache[currentProgram]) {
        const months = monthsCache[currentProgram];
        const cur = beijingMonth();
        const sel = document.getElementById("monthFilter");
        if (!months.includes(currentMonth)) months.unshift(currentMonth);
        if (!months.includes(cur)) months.unshift(cur);
        sel.innerHTML = months.map(m =>
          `<option value="${m}">${m.replace("-", "年")}月</option>`
        ).join("");
        availableMonths = [...months];
        applyMonthToSelect();
        return;
      }
      const months = await api("/api/months?program=" + currentProgram);
      const sel = document.getElementById("monthFilter");
      const cur = beijingMonth();
      if (!currentMonth) {
        persistMonth(cur);
      }
      if (!months.includes(currentMonth)) {
        months.unshift(currentMonth);
      }
      if (!months.includes(cur)) {
        months.unshift(cur);
      }
      sel.innerHTML = months.map(m =>
        `<option value="${m}">${m.replace("-", "年")}月</option>`
      ).join("");
      availableMonths = [...months];
      monthsCache[currentProgram] = [...months];
      applyMonthToSelect();

    async function loadCloseJobStatus() {
      if (window.__PAGES_MODE__) return;
      const el = document.getElementById("closeJobStatus");
      if (!el) return;
      try {
        const s = await api("/api/jobs/after-close/status");
        const today = beijingToday();
        const parts = [];
        for (const prog of PROGRAMS) {
          const done = s[`last_close_run_date_${prog}`] || (prog === "stock" ? s.last_close_run_date : "") || "";
          const tag = PROGRAM_LABEL[prog] || prog;
          parts.push(`${tag}:${done === today ? "✓" : "待"}`);
        }
        const mr = s.morning_readiness || {};
        const mParts = [];
        for (const prog of ["slow", "up"]) {
          const p = (mr.programs || {})[prog] || {};
          const tag = prog === "slow" ? "Slow" : "Up";
          if (p.ready) mParts.push(`${tag}:✓`);
          else if (mr.date === today) mParts.push(`${tag}:⚠${p.reason || "缺"}`);
          else mParts.push(`${tag}:待`);
        }
        el.textContent = `收盘 ${parts.join(" | ")} ｜ 早盘 ${mParts.join(" ")}`;
        if ((mr.programs || {}).up && !mr.programs.up.ready && mr.date === today) {
          el.style.color = "#dc2626";
        } else {
          el.style.color = "";
        }
      } catch (e) {
        el.textContent = "收盘补全状态读取失败";
      }
    }

    function round2(n) { return Math.round(n * 100) / 100; }

    function weekdayOf(dateStr) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(dateStr || ""));
      if (!m) return "—";
      const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      if (Number.isNaN(dt.getTime())) return "—";
      return ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][dt.getDay()];
    }

    function cellHtml(t, c) {
      if (c.key === "_ops") {
        if (window.__PAGES_MODE__) return "—";
        return `<div class="ops">
          <button class="icon-btn edit" title="编辑" onclick="openEdit(${t.id})">✎</button>
          <button class="icon-btn price" title="补空值/遗漏" onclick="refreshOne(${t.id})">↻</button>
          <button class="icon-btn del" title="删除" onclick="removeTrade(${t.id})">✕</button>
        </div>`;
      }
      if (c.key === "is_second_board") {
        return t.is_second_board === true ? `<span class="badge badge-yes">是</span>`
           : (t.is_second_board === false ? `<span class="badge badge-no">否</span>` : "—");
      }
      if (c.key === "rank" || c.key === "board_rank") {
        const r = int(t[c.key], 0);
        if (r === 1) return '<span class="rank-tag rank-1">🥇 第一名</span>';
        if (r === 2) return '<span class="rank-tag rank-2">🥈 第二名</span>';
        return r ? `第${r}名` : "—";
      }
      if (c.key === "weekday") return `<span class="weekday">${weekdayOf(t.date)}</span>`;
      if (c.key === "stock_code") return `<span class="code">${t.stock_code || ""}</span>`;
      if (c.key === "stock_name") {
        const name = t.stock_name || "—";
        const url = baiduFinanceUrl(t.stock_code);
        if (!url || name === "—") return name;
        return `<a class="name-link" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`;
      }
      if (c.key === "board") {
        const b = t.board;
        if (!b) return "—";
        const cls = b === "创业板" ? "board-cyb" : b === "主板" ? "board-zb" : "board-other";
        return `<span class="board-tag ${cls}">${b}</span>`;
      }
      if (c.key === "sell_price_935" && t.sell_price_935 == null && t.sell_price_1315 == null) {
        if (t.skip_reason && t.skip_reason.includes("买不进")) {
          return `<span class="badge badge-no-buy">没买</span>`;
        }
        return `<span class="badge badge-hold">持仓中</span>`;
      }
      const v = t[c.key];
      if (c.pnl) {
        if (v == null || v === "") return "—";
        return `<span>${(Number(v) > 0 ? "+" : "") + v}%</span>`;
      }
      return fmt(v);

          method: "POST",

    async function runCloseJob() {
      if (busy) return;
      try {
        setLoading(true, "收盘补全执行中 (stock/slow/up/水下)…");
        const r = await api("/api/jobs/after-close", {
          method: "POST",
          body: JSON.stringify({ force: false, program: "all" }),
        });
        const parts = [];
        for (const prog of PROGRAMS) {
          const x = r[prog] || {};
          if (x.skipped) parts.push(`${prog}:跳过`);
          else if (x.error) parts.push(`${prog}:失败`);
          else parts.push(`${prog}:买${(x.buy_sync&&x.buy_sync.synced)||0}/补卖${x.sell_enriched||0}`);
        }
        toast(`收盘补全完成 — ${parts.join(" · ")}`);
        await loadAll();
      } catch (e) { toast(e.message || "收盘补全失败"); }
      finally { setLoading(false); }
    }

      return r.json();
    }

    async function __pagesDecrypt(payload, password) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
      const tag = Uint8Array.from(atob(payload.tag), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(payload.ct), c => c.charCodeAt(0));
      const body = new Uint8Array(ct.length + tag.length);
      body.set(ct, 0); body.set(tag, ct.length);
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: payload.iter || 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    function __pagesUpdateAuthUi() {
      const badge = document.getElementById("authBadge");
      const btn = document.getElementById("btnAuth");
      if (!badge || !btn) return;
      badge.style.display = "";
      btn.style.display = "";
      badge.textContent = window.__PAGES_FULL__ ? "已登录·完整" : "公开·脱敏";
      btn.textContent = window.__PAGES_FULL__ ? "退出" : "登录";
    }

    function __pagesShowTransit(msg) {
      const el = document.getElementById("authTransit");
      const text = document.getElementById("authTransitMsg");
      if (text) text.textContent = msg || "处理中…";
      if (el) el.classList.add("show");
    }

    function __pagesHideTransit() {
      document.getElementById("authTransit")?.classList.remove("show");
    }

    function __pagesSetLoginBusy(busy) {
      const ok = document.getElementById("authOk");
      const cancel = document.getElementById("authCancel");
      const user = document.getElementById("authUser");
      const pass = document.getElementById("authPass");
      if (ok) {
        ok.disabled = !!busy;
        ok.textContent = busy ? "登录中…" : "登录";
      }
      if (cancel) cancel.disabled = !!busy;
      if (user) user.disabled = !!busy;
      if (pass) pass.disabled = !!busy;
    }

    async function __pagesPaint() {
      // 重活前强制刷一帧，避免手机端「点了没反应」
      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
    }

    function __pagesToggleAuth() {
      if (window.__pagesLoginLock) return;
      if (window.__PAGES_FULL__) {
        __pagesShowTransit("正在退出，切回脱敏视图…");
        setTimeout(() => {
          window.__PAGES_FULL__ = null;
          window.__PAGES_SNAPSHOT__ = window.__PAGES_MASKED__;
          sessionStorage.removeItem("trade_ui_authed");
          __pagesUpdateAuthUi();
          loadAll().finally(() => {
            __pagesHideTransit();
            toast("已退出，当前为脱敏公开视图");
          });
        }, 40);
        return;
      }
      document.getElementById("authModal").classList.add("show");
      document.getElementById("authUser").value = "stock";
      document.getElementById("authPass").value = "";
      document.getElementById("authErr").textContent = "";
      __pagesSetLoginBusy(false);
      setTimeout(() => document.getElementById("authPass")?.focus(), 40);
    }

    async function __pagesDoLogin() {
      if (window.__pagesLoginLock) return;
      const user = (document.getElementById("authUser").value || "").trim().toLowerCase();
      const pass = document.getElementById("authPass").value || "";
      const err = document.getElementById("authErr");
      if (user !== "stock") { err.textContent = "账号或密码错误"; return; }
      if (!pass) { err.textContent = "请输入密码"; return; }
      if (!window.crypto || !window.crypto.subtle) {
        err.textContent = "当前浏览器不支持安全解密，请升级系统浏览器后重试";
        return;
      }
      err.textContent = "";
      window.__pagesLoginLock = true;
      __pagesSetLoginBusy(true);
      __pagesShowTransit("正在校验并解密数据，手机端可能需几秒…");
      await __pagesPaint();
      try {
        const enc = await __pagesFetchJson("data/encrypted.json");
        __pagesShowTransit("正在解密完整数据…");
        await __pagesPaint();
        const full = await __pagesDecrypt(enc, pass);
        document.getElementById("authModal").classList.remove("show");
        __pagesShowTransit("登录成功，正在加载看板…");
        await __pagesPaint();
        window.__PAGES_FULL__ = full;
        window.__PAGES_SNAPSHOT__ = full;
        sessionStorage.setItem("trade_ui_authed", "1");
        __pagesUpdateAuthUi();
        await loadAll();
        toast("登录成功 · 已显示完整数据");
      } catch (e) {
        const msg = (e && e.message) ? String(e.message) : "";
        if (/加载失败|Failed to fetch|NetworkError/i.test(msg)) {
          err.textContent = "网络异常，请检查网络后重试";
        } else {
          err.textContent = "密码错误或解密失败，请重试";
        }
        toast(err.textContent);
      } finally {
        window.__pagesLoginLock = false;
        __pagesSetLoginBusy(false);
        __pagesHideTransit();
      }
    }

    async function __pagesBoot() {
      const masked = await __pagesFetchJson("data/masked.json");
      window.__PAGES_MASKED__ = masked;
      window.__PAGES_SNAPSHOT__ = masked;
      __pagesUpdateAuthUi();
      document.getElementById("pagesBootMask")?.classList.add("done");
    }

    (async () => {
      if (window.__PAGES_MODE__) {
        try {
          window.__PAGES_BOOT__ = __pagesBoot();
          await window.__PAGES_BOOT__;
          document.getElementById("btnAuth")?.addEventListener("click", __pagesToggleAuth);
          document.getElementById("authCancel")?.addEventListener("click", () => {
            if (window.__pagesLoginLock) return;
            document.getElementById("authModal").classList.remove("show");
          });
          // onclick 已绑 __pagesDoLogin；此处再绑一次无妨（有 loginLock）
          document.getElementById("authOk")?.addEventListener("click", (e) => {
            e.preventDefault();
            __pagesDoLogin();
          });
          document.getElementById("authPass")?.addEventListener("keydown", (e) => {
            if (e.key === "Enter") __pagesDoLogin();
          });
          document.getElementById("authUser")?.addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("authPass")?.focus();
          });
        } catch (e) {
          const el = document.getElementById("pagesBootMask");
          if (el) el.textContent = "看板数据加载失败：" + (e && e.message ? e.message : e);
          return;
        }
      }
      restoreMonth();
      applyLaneState(currentLane);
      applyViewMode();
      await loadMonths();
      await loadAll();
    })();
  </script>
</body>
